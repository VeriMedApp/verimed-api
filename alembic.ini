# Alembic-Konfiguration fuer Project VeriMed.
# Die tatsaechliche DB-URL wird in alembic/env.py aus app.config gesetzt.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Platzhalter; wird in env.py durch settings.effective_sync_database_url ueberschrieben.
sqlalchemy.url = sqlite:///./verimed.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
