# Render Blueprint fuer Project VeriMed (Docker-Runtime mit Tesseract-OCR)
# Deploy: Render Dashboard -> New -> Blueprint -> dieses Repo verbinden
# Docs: https://render.com/docs/blueprint-spec
#
# WARNUNG: DATABASE_URL zeigt hier bewusst auf eine lokale SQLite-Datei im
# Container (./verimed.db). Render-Webdienste haben KEIN persistentes
# Dateisystem, sofern nicht explizit eine "disk" gemountet wird - ohne diese
# gehen alle Daten (inkl. verschluesselter Patientendaten) bei jedem Deploy,
# Neustart oder Scaling-Event verloren. Fuer produktiven Einsatz entweder
# unten einen "disk"-Mount ergaenzen oder auf eine verwaltete PostgreSQL-
# Datenbank zurueckwechseln (siehe DEPLOY.md).

services:
  - type: web
    name: verimed-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./verimed.db
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: TIME_TOLERANCE_MINUTES
        value: "10"
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
